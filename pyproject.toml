[project]
name = "arcana"
version = "0.1.0"
description = "Pixel-art card generation: a modular tile/palette engine and per-deck configs"
readme = "README.md"
authors = [
    { name = "Maxwell Margenot", email = "max.margenot@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.0",
]

[project.scripts]
arcana = "arcana.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

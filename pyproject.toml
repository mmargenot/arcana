[project]
name = "arcana"
version = "0.1.0"
description = "Pixel-art card generation: a modular tile/palette engine and per-deck configs"
readme = "README.md"
authors = [
    { name = "Maxwell Margenot", email = "max.margenot@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.0",
]

[project.scripts]
arcana = "arcana.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Deliberately narrow: Pyflakes (F) catches unused imports and dead locals — the
# class of cruft this lint exists to prevent going forward. Style rules (E/W
# pycodestyle, I import-order) are intentionally left off: this codebase uses a
# consistent compact style (e.g. `p = Path(x); p.mkdir(...)`) that those rules
# would churn without improving correctness.
select = ["F"]

# Generation config: the deck's house style, plus one prompt per face card.
#
# Style, strength and candidate count are DECK IDENTITY — settled once so all
# 22 majors look like one deck — which is why they live here and not behind CLI
# flags, the same split as pip_layouts and field_designs in deck.yaml.
#
# The model is here for SEMANTIC COLOUR, not pixelation. Seeded with an RWS
# scan it keeps the composition and re-renders it in the deck's palette; a
# nearest-colour mapping cannot, because it only knows the Fool's aged sky is
# warm, not that it is a sky.

provider: retro-diffusion

# TRANSFORMATIVE, NOT GENERATIVE. The goal is to map an existing RWS card into
# pixel space 1-to-1, not to generate a new card from a description. Those are
# different styles: rd_plus__* and rd_fast__* invent a scene from the prompt,
# while rd_pro__pixelate takes the input image as the subject and re-renders it.
# Its 64-256px range covers the 144x224 art window.
style: rd_pro__pixelate

# How far the model may depart from the seed. 0.6 is generative latitude and
# produces "a card like this one"; low values hold the composition. The old
# warning that low strength preserves the scan's own colour applied to feeding a
# RAW scan -- this seed is already reduced, and `input_palette` constrains
# colour, so holding close is now the safer end. Expect to tune this first.
strength: 0.35

candidates: 4

# Style used when there is NO seed (`arcana rd --no-init`). A transformative
# style takes the input image as its subject, so without one the service has
# nothing to work from and refuses the call — generating from the prompt alone
# is a different job and names its own style.
seedless_style: rd_plus__item_sheet

# THE GROUND. A mural is an image laid on a field, and the field is what paints
# the card's background — so if the art carries its own opaque sky, the two
# backgrounds meet at a visible rectangle. Make the ground transparent and the
# seam cannot exist: the sky IS the mat, one set of pixels, and it inherits
# whatever `field_designs` says.
#
# `remove_bg` asks the service for a transparent background (free, first-class,
# and quantize already maps alpha to index 0). It is built for sprites, so on a
# full scene it may take the mountains with the sky — check one generation.
#
# Import always REGROUNDS: it finds the art's background — flooding in from the
# border, never touching line or paper (the figure's outline runs to the border,
# and an unguarded flood would take the figure with it) and only for regions
# large enough to be sky — and moves those pixels into the `field` bank at the
# value rung they already sit on. Every bank shares the same rungs, so the sky
# keeps its shape and its values and changes only hue family. Nothing is
# deleted, and the ground recolours with the palette from then on.
#
# `knockout_ground` is the stronger form: remove the ground entirely so the card's
# field paints it. Use it for art that should carry no sky of its own. It is
# destructive — a night sky or a pool painted in field-bank tones is background
# that should stay — so regrounding is the default.
remove_bg: true
knockout_ground: false

# Style, appended to every subject below. Written ONCE because it is the deck's
# look, not the card's.
#
# EMBLEM, NOT SCENE. Each card is one symbolic object floating on nothing — the
# card's attribute rather than its tableau. This is why the seeded path fought
# us: an RWS scan hands the model a figure in a landscape and asks it to hold
# that composition, which is the opposite of an emblem. Emblems want --no-init.
#
# TRANSPARENT GROUND. With no scenery there is nothing to lose to background
# removal, so `remove_bg` is finally the right tool rather than a risk — and a
# transparent ground is what lets the card's own field, frame and palette carry
# the look instead of the art fighting them.
style_suffix: >-
  a single isolated emblem on a fully transparent background, no scenery and no
  horizon, thick dark outline, flat blocks of solid colour, generous empty
  margins, symmetrical, high contrast

# ONE EMBLEM PER CARD, carrying that card's symbols — the attribute rather than
# the scene. Each element is named in the colour word of the BANK it should land
# in, so the art arrives already organised into banks instead of nearest-colour
# scattering them afterwards:
#
#   violet    border  architecture, thrones, pillars, altars   (hue 264)
#   teal      field   water, rivers, pools                     (hue 195)
#   magenta   motif   props and accents                        (hue 332)
#   warm tan  figure  wood, gold, flame, bone, beasts          (hue  19)
#   white     paper   roses, stars, bones, ribbons
#
# Change a bank's hue in palette.yaml and these words go stale — a test pins
# them, so that fails loudly instead of drifting.
#
# Only the Magician (altar) and the Devil (half-cube pedestal) are traditionally
# raised on one; the sovereigns get thrones. The other sixteen float, and are
# written that way.
prompts:
  major_00: >-
    a warm tan staff carrying a white bindle, a white five-petalled rose held
    out, a small white dog leaping, magenta blossoms
  major_01: >-
    a violet altar table bearing a white cup, a warm tan coin, a white sword and
    a warm tan wand, a magenta infinity sign above it
  major_02: >-
    a white scroll between two violet pillars, a white crescent moon lying
    below, magenta pomegranates on a teal veil
  major_03: >-
    a white crown of twelve stars above a warm tan sheaf of wheat, a magenta
    venus sigil, a violet cushioned throne
  major_04: >-
    a violet stone throne with warm tan ram heads at its arms, a warm tan ankh
    sceptre and a white orb crossed above it
  major_05: >-
    a white triple crown above two crossed white keys, a warm tan staff with a
    triple cross, flanked by two violet pillars
  major_06: >-
    two white rings beneath a warm tan sun, magenta flames rising in one tree, a
    white serpent coiled about the other
  major_07: >-
    a violet chariot car under a canopy of white stars, two sphinxes one black
    one white, magenta crescents at its corners
  major_08: >-
    a warm tan lion's head wreathed in a magenta flower garland, a white
    infinity sign above it
  major_09: >-
    a warm tan lantern holding a white six-pointed star, a long violet staff
    crossed behind it
  major_10: >-
    a great violet wheel lettered ROTA, a white sphinx couchant above it, a
    magenta serpent descending, a warm tan jackal rising
  major_11: >-
    a white upright sword crossed with warm tan scales, a violet crown between
    them, magenta veil behind
  major_12: >-
    a warm tan living T-cross of wood, a white rope, a white halo hanging
    beneath it, magenta leaves
  major_13: >-
    a white skull in violet armour, a black banner bearing a white five-petalled
    rose, a warm tan bone scythe
  major_14: >-
    two warm tan cups pouring one into the other, a teal stream between them,
    magenta irises, a white triangle within a square
  major_15: >-
    a violet half-cube pedestal, a magenta inverted pentagram above it, a warm
    tan torch held downward, white chains hanging
  major_16: >-
    a violet tower struck by white lightning, a magenta crown tumbling from its
    top, warm tan flames, white yods falling
  major_17: >-
    a great white eight-pointed star with seven smaller, two warm tan vessels
    pouring teal water, a magenta ibis
  major_18: >-
    a white crescent moon with a face, two violet towers, magenta yods falling,
    a warm tan crayfish in teal water
  major_19: >-
    a great warm tan sun with a face and magenta rays, four magenta sunflowers,
    a white banner
  major_20: >-
    a warm tan trumpet with a white banner bearing a magenta cross, three white
    figures rising, teal water below
  major_21: >-
    a magenta laurel wreath bound with white ribbons, two warm tan wands
    crossed, four white creatures at its corners

# Generation config: the deck's house style, plus one prompt per face card.
#
# Style, strength and candidate count are DECK IDENTITY — settled once so all
# 22 majors look like one deck — which is why they live here and not behind CLI
# flags, the same split as pip_layouts and field_designs in deck.yaml.
#
# THE MODEL IS HERE FOR A LOOK IT CAN BE SHOWN, not one it can be told. The
# single most important fact about this API: `input_palette` is applied AFTER
# generation — the service exposes `return_pre_palette` to hand back the
# un-quantised image, which only makes sense if quantising is a post-process. So
# the palette re-maps colours and never once made the model draw flat. What does
# is `refs/`: RD Pro takes up to nine reference images and is the tier documented
# for "matching an existing look".

provider: retro-diffusion

# GENERATIVE, AND SEEDLESS BY DEFAULT. The old plan was transformative — feed an
# RWS scan to rd_pro__pixelate and hold its composition. That fought the emblem
# from the first generation: a scan is a figure in a landscape, and an emblem is
# one object on nothing. `arcana rd` now generates from the prompt and the
# references, and `--init` opts back into seeding for the odd card that wants it.
#
# rd_pro__default over the cheaper tiers because RD Pro is the ONLY one that
# accepts reference_images, which is the whole strategy. Its 64-256px range
# covers the 112x208 safe area. rd_pro__simple is the other candidate and is
# worth an arm of the comparison; rd_plus__mc_item is the flattest non-Pro style
# (Minecraft items are outlined icons on transparency) but takes no references.
style: rd_pro__default
seedless_style: rd_pro__default

# How far the model may depart from a seed. Only consulted when --init is passed,
# which is now the exception rather than the rule.
strength: 0.35

candidates: 4

# THE GROUND. A mural is an image laid on a field, and the field is what paints
# the card's background — so if the art carries its own opaque sky, the two
# backgrounds meet at a visible rectangle. Make the ground transparent and the
# seam cannot exist: the sky IS the mat, one set of pixels, and it inherits
# whatever `field_designs` says.
#
# `remove_bg` asks the service for a transparent background (free, first-class,
# and quantize already maps alpha to index 0). It is built for sprites, so on a
# full scene it may take the mountains with the sky — check one generation.
#
# Import always REGROUNDS: it finds the art's background — flooding in from the
# border, never touching line or paper (the figure's outline runs to the border,
# and an unguarded flood would take the figure with it) and only for regions
# large enough to be sky — and moves those pixels into the `field` bank at the
# value rung they already sit on. Every bank shares the same rungs, so the sky
# keeps its shape and its values and changes only hue family. Nothing is
# deleted, and the ground recolours with the palette from then on.
#
# `knockout_ground` is the stronger form: remove the ground entirely so the card's
# field paints it. Use it for art that should carry no sky of its own. It is
# destructive — a night sky or a pool painted in field-bank tones is background
# that should stay — so regrounding is the default.
remove_bg: true
knockout_ground: false

# Style, appended to every subject below. Written ONCE because it is the deck's
# look, not the card's.
#
# EMBLEM, NOT SCENE. Each card is one symbolic object floating on nothing — the
# card's attribute rather than its tableau. This is why the seeded path fought
# us: an RWS scan hands the model a figure in a landscape and asks it to hold
# that composition, which is the opposite of an emblem. Seedless is now default.
#
# STYLE LEADS, AND A FULL STOP SEPARATES IT FROM THE SYMBOLS. This used to be a
# SUFFIX joined with a comma, and that was a bug rather than a matter of taste:
# major_17 went out as "...a magenta ibis on a violet tree, a single isolated
# emblem filling the whole frame", where the emblem sits in the same grammatical
# slot as the ibis and reads as a fourth thing to draw. It also contradicted
# itself, demanding one isolated emblem while naming four objects.
#
# Leading is the stronger position: earlier tokens carry more weight in a
# CLIP-conditioned model, and the old prompt ran ~90 tokens against CLIP's 77, so
# the style notes sat exactly where truncation would eat them. Now the grammar
# works for us — "a single flat emblem icon. a great white star..." reads as an
# icon OF a star.
#
# POSITIVE ONLY. The old text carried six negations — "no gradients, no
# dithering, no highlights, no drop shadows, no scenery and no horizon" — and got
# shaded emblems anyway. There is no negation mechanism in a positive prompt;
# naming "horizon" and "drop shadows" raises their odds. RD's `negative` field is
# a documented non-functional placeholder, so there is nowhere correct to put
# them at all. They are gone.
#
# Nothing here restates a PARAMETER either. `remove_bg` gives the transparent
# ground, so asking for one in words only spends tokens. RD's own guidance is
# "describe the subject — the style handles rendering", and with RD Pro plus nine
# reference images doing that job, this only has to avoid contradicting them.
style_prefix: >-
  a single flat emblem icon filling the frame, thick dark outline, one solid
  colour per shape, high contrast

# ONE EMBLEM PER CARD, carrying that card's symbols — the attribute rather than
# the scene. Each element is named in the colour word of the BANK it should land
# in, so the art arrives already organised into banks instead of nearest-colour
# scattering them afterwards:
#
#   violet    border  architecture, thrones, pillars, altars   (hue 264)
#   teal      field   water, rivers, pools                     (hue 195)
#   magenta   motif   props and accents                        (hue 332)
#   warm tan  figure  wood, gold, flame, bone, beasts          (hue  19)
#   white     paper   roses, stars, bones, ribbons
#
# Change a bank's hue in palette.yaml and these words go stale — a test pins
# them, so that fails loudly instead of drifting.
#
# EVERY PROMPT NAMES VIOLET, MAGENTA AND WARM TAN, because border, motif and
# figure have no donor but the art — a card whose emblem never paints magenta
# has no magenta, and the import says so. TEAL IS DIFFERENT and deliberately
# rare: the card's own mat paints the field bank, so an emblem on a transparent
# ground inherits teal without spending a shape on it. Majors have plain fields.
# Teal appears only where the card genuinely holds water — the Star's stream,
# Temperance's pool, the Moon, Judgement.
#
# Only the Magician (altar) and the Devil (half-cube pedestal) are traditionally
# raised on one; the sovereigns get thrones. The other sixteen float, and are
# written that way.
prompts:
  major_00: >-
    a great white five-petalled rose filling the frame, two warm tan open
    palms cupped at its sides, a small magenta feather above
  major_01: >-
    a great magenta infinity sign dominating the upper frame, a violet altar
    table below bearing a white cup, a warm tan coin and a white sword
  major_02: >-
    two tall violet pillars flanking the frame, a great magenta crescent moon
    lying between them, a small warm tan scroll below, tiny magenta blossoms
  major_03: >-
    a great white heart filling the frame, a bold magenta venus sigil at its
    centre, two warm tan wheat stalks crossed behind, small white sparkles
    above
  major_04: >-
    a great warm tan ram's head dominating the frame, a violet throne behind
    it, a small magenta robe draped across, a white orb below
  major_05: >-
    a great white triple crown filling the upper frame, two warm tan keys
    crossed below it, a magenta mantle behind, two small violet pillars at the
    edges
  major_06: >-
    a great white winged serpent coiled through the frame, a warm tan sun
    above, magenta flames at its base, a small violet mountain behind
  major_07: >-
    a great warm tan winged disk filling the frame, a violet chariot car
    below, magenta crescent epaulettes at the sides, small white stars above
  major_08: >-
    a great warm tan lion's head dominating the frame, a magenta flower
    garland around it, a white infinity sign above, a small violet peak behind
  major_09: >-
    a great warm tan lantern filling the frame, a white six-pointed star
    burning inside it, a long violet staff behind, small magenta rays
  major_10: >-
    a great magenta wheel filling the frame, concentric rings and eight
    spokes, a warm tan hub at its centre, four small white orbs set around its
    rim
  major_11: >-
    a great white sword upright through the frame, warm tan scales hanging
    from its crossguard, a violet crown above, a small magenta pendant
  major_12: >-
    a great warm tan T-cross of wood filling the frame, a white rope and halo
    hanging beneath, a violet tunic, magenta foliage crowning it
  major_13: >-
    a great white skull filling the frame, a single magenta flower on a warm
    tan stem below it, a violet collar beneath
  major_14: >-
    two great warm tan cups pouring one into the other, a teal stream arcing
    between them, a white triangle in a violet square above, magenta irises
    below
  major_15: >-
    a great warm tan goat's head filling the frame, a magenta inverted
    pentagram behind it, a violet ring enclosing both, two small warm tan
    torches below
  major_16: >-
    a great violet tower filling the frame, a white lightning bolt striking
    its crown, a magenta crown tumbling away, small warm tan flames falling
  major_17: >-
    a great white eight-pointed star filling the frame, a magenta rosette at
    its heart, a warm tan hub, small magenta sparkles scattered around it
  major_18: >-
    a great white moon with a face filling the upper frame, warm tan rays
    around it, magenta droplets falling below, two small violet towers at the
    base
  major_19: >-
    a great warm tan sun with a sleeping face filling the frame, alternating
    warm tan and magenta rays, small white sparkles at the corners, a violet
    edge
  major_20: >-
    a great warm tan trumpet across the frame, a white banner bearing a
    magenta cross hanging from it, teal water below, a small violet coffin
  major_21: >-
    a great magenta laurel wreath filling the frame, a violet scarf spiralling
    within it, two warm tan wands crossed, four small white creatures at the
    corners

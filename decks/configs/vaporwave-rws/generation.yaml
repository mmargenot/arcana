# Generation config: the deck's house style, plus one prompt per face card.
#
# Style, strength and candidate count are DECK IDENTITY — settled once so all
# 22 majors look like one deck — which is why they live here and not behind CLI
# flags, the same split as pip_layouts and field_designs in deck.yaml.
#
# The model is here for SEMANTIC COLOUR, not pixelation. Seeded with an RWS
# scan it keeps the composition and re-renders it in the deck's palette; a
# nearest-colour mapping cannot, because it only knows the Fool's aged sky is
# warm, not that it is a sky.

provider: retro-diffusion

# TRANSFORMATIVE, NOT GENERATIVE. The goal is to map an existing RWS card into
# pixel space 1-to-1, not to generate a new card from a description. Those are
# different styles: rd_plus__* and rd_fast__* invent a scene from the prompt,
# while rd_pro__pixelate takes the input image as the subject and re-renders it.
# Its 64-256px range covers the 144x224 art window.
style: rd_pro__pixelate

# How far the model may depart from the seed. 0.6 is generative latitude and
# produces "a card like this one"; low values hold the composition. The old
# warning that low strength preserves the scan's own colour applied to feeding a
# RAW scan -- this seed is already reduced, and `input_palette` constrains
# colour, so holding close is now the safer end. Expect to tune this first.
strength: 0.35

candidates: 4

# THE GROUND. A mural is an image laid on a field, and the field is what paints
# the card's background — so if the art carries its own opaque sky, the two
# backgrounds meet at a visible rectangle. Make the ground transparent and the
# seam cannot exist: the sky IS the mat, one set of pixels, and it inherits
# whatever `field_designs` says.
#
# `remove_bg` asks the service for a transparent background (free, first-class,
# and quantize already maps alpha to index 0). It is built for sprites, so on a
# full scene it may take the mountains with the sky — check one generation.
#
# `knockout_ground` is the local fallback: flood the art's own ground to
# transparent at import, never touching line or paper (the figure's outline runs
# to the border, and an unguarded flood dissolves the figure) and only for
# regions large enough to be sky.
#
# Both default off, because an opaque ground is sometimes deliberate — a night
# sky or a pool painted in field-bank tones is background that should stay.
remove_bg: false
knockout_ground: true

# Subject only, and TERSE. With a pixelate style the input image is the subject;
# the prompt is an anchor that stops drift, not a description to render. A long
# narrative prompt invites invention -- extra props, a drawn frame, a vignette.
#
# NEVER write "pixel art": the style handles rendering, and saying it tends to
# produce a picture *of* pixel art.
#
# Border cruft cannot be prompted away -- the API's `negative` field exists but
# current models ignore it. Two things handle it instead: the seed is cropped to
# the picture area so RWS's own printed frame and title band never reach the
# model, and `import-mural` warns when the result puts heavy line work in the
# margin the deck's frame will cover.
prompts:
  major_00: the fool, a traveller at a cliff edge with a white dog and a rose

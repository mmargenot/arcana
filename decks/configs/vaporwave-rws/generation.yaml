# Generation config: the deck's house style, plus one prompt per face card.
#
# Style, strength and candidate count are DECK IDENTITY — settled once so all
# 22 majors look like one deck — which is why they live here and not behind CLI
# flags, the same split as pip_layouts and field_designs in deck.yaml.
#
# THE MODEL IS HERE FOR A LOOK IT CAN BE SHOWN, not one it can be told. The
# single most important fact about this API: `input_palette` is applied AFTER
# generation — the service exposes `return_pre_palette` to hand back the
# un-quantised image, which only makes sense if quantising is a post-process. So
# the palette re-maps colours and never once made the model draw flat. What does
# is `refs/`: RD Pro takes up to nine reference images and is the tier documented
# for "matching an existing look".

provider: retro-diffusion

# GENERATIVE, AND SEEDLESS BY DEFAULT. The old plan was transformative — feed an
# RWS scan to rd_pro__pixelate and hold its composition. That fought the emblem
# from the first generation: a scan is a figure in a landscape, and an emblem is
# one object on nothing. `arcana rd` now generates from the prompt and the
# references, and `--init` opts back into seeding for the odd card that wants it.
#
# rd_pro__default over the cheaper tiers because RD Pro is the ONLY one that
# accepts reference_images, which is the whole strategy. Its 64-256px range
# covers the 112x208 safe area. rd_pro__simple is the other candidate and is
# worth an arm of the comparison; rd_plus__mc_item is the flattest non-Pro style
# (Minecraft items are outlined icons on transparency) but takes no references.
style: rd_pro__default
seedless_style: rd_pro__default

# How far the model may depart from a seed. Only consulted when --init is passed,
# which is now the exception rather than the rule.
strength: 0.35

candidates: 4

# THE GROUND. A mural is an image laid on a field, and the field is what paints
# the card's background — so if the art carries its own opaque sky, the two
# backgrounds meet at a visible rectangle. Make the ground transparent and the
# seam cannot exist: the sky IS the mat, one set of pixels, and it inherits
# whatever `field_designs` says.
#
# `remove_bg` asks the service for a transparent background (free, first-class,
# and quantize already maps alpha to index 0). It is built for sprites, so on a
# full scene it may take the mountains with the sky — check one generation.
#
# Import always REGROUNDS: it finds the art's background — flooding in from the
# border, never touching line or paper (the figure's outline runs to the border,
# and an unguarded flood would take the figure with it) and only for regions
# large enough to be sky — and moves those pixels into the `field` bank at the
# value rung they already sit on. Every bank shares the same rungs, so the sky
# keeps its shape and its values and changes only hue family. Nothing is
# deleted, and the ground recolours with the palette from then on.
#
# `knockout_ground` is the stronger form: remove the ground entirely so the card's
# field paints it. Use it for art that should carry no sky of its own. It is
# destructive — a night sky or a pool painted in field-bank tones is background
# that should stay — so regrounding is the default.
remove_bg: true
knockout_ground: false

# Style, appended to every subject below. Written ONCE because it is the deck's
# look, not the card's.
#
# EMBLEM, NOT SCENE. Each card is one symbolic object floating on nothing — the
# card's attribute rather than its tableau. This is why the seeded path fought
# us: an RWS scan hands the model a figure in a landscape and asks it to hold
# that composition, which is the opposite of an emblem. Seedless is now default.
#
# WORDS ARE THE WEAKEST OF THE THREE LEVERS. This suffix asked for "no gradients,
# no dithering, no highlights" and got shaded emblems anyway. Style and reference
# images do the work; this only has to avoid contradicting them.
#
# TRANSPARENT GROUND. With no scenery there is nothing to lose to background
# removal, so `remove_bg` is finally the right tool rather than a risk — and a
# transparent ground is what lets the card's own field, frame and palette carry
# the look instead of the art fighting them.
#
# FILLING THE FRAME IS PART OF THE STYLE. This asked for "generous empty
# margins" and got exactly that: major_00 came back with 2189 opaque pixels of a
# 112x208 generation — 9.4% coverage, an emblem lost in its own window. The
# margin the card needs is already cut by generating at the safe size, so asking
# for more here spends the art on nothing twice. The emblem should run to the
# edges of what it is given.
style_suffix: >-
  a single isolated emblem filling the whole frame edge to edge, large and
  centred with only a thin margin, on a fully transparent background, no scenery
  and no horizon, thick dark outline, one flat colour per shape, no gradients,
  no dithering, no highlights, no drop shadows, high contrast

# ONE EMBLEM PER CARD, carrying that card's symbols — the attribute rather than
# the scene. Each element is named in the colour word of the BANK it should land
# in, so the art arrives already organised into banks instead of nearest-colour
# scattering them afterwards:
#
#   violet    border  architecture, thrones, pillars, altars   (hue 264)
#   teal      field   water, rivers, pools                     (hue 195)
#   magenta   motif   props and accents                        (hue 332)
#   warm tan  figure  wood, gold, flame, bone, beasts          (hue  19)
#   white     paper   roses, stars, bones, ribbons
#
# Change a bank's hue in palette.yaml and these words go stale — a test pins
# them, so that fails loudly instead of drifting.
#
# EVERY PROMPT NAMES VIOLET, MAGENTA AND WARM TAN, because border, motif and
# figure have no donor but the art — a card whose emblem never paints magenta
# has no magenta, and the import says so. TEAL IS DIFFERENT and deliberately
# rare: the card's own mat paints the field bank, so an emblem on a transparent
# ground inherits teal without spending a shape on it. Majors have plain fields.
# Teal appears only where the card genuinely holds water — the Star's stream,
# Temperance's pool, the Moon, Judgement.
#
# Only the Magician (altar) and the Devil (half-cube pedestal) are traditionally
# raised on one; the sovereigns get thrones. The other sixteen float, and are
# written that way.
prompts:
  major_00: >-
    a white five-petalled rose in the center, spaced between two open palms on
    the sides
  major_01: >-
    a violet altar table bearing a white cup, a warm tan coin. a white sword and
    a warm tan wand lie on the table, and a magenta infinity sign sits in the sky
    above it
  major_02: >-
    a warm tan scroll lettered TORA between two violet pillars, a white crescent
    moon lying below, magenta pomegranates on the veil
  major_03: >-
    a white crown of twelve stars above a warm tan sheaf of wheat, a magenta
    venus sigil, a violet cushioned throne
  major_04: >-
    a violet stone throne with warm tan ram heads at its arms, a magenta robe
    draped across it, a warm tan ankh sceptre and a white orb crossed above
  major_05: >-
    a white triple crown above two crossed white keys, a magenta mantle, a warm
    tan staff with a triple cross, flanked by two violet pillars
  major_06: >-
    two white rings beneath a warm tan sun, a violet mountain peak between them,
    magenta flames rising in one tree, a white serpent coiled about the other
  major_07: >-
    a violet chariot car under a canopy of white stars, a warm tan winged disk on
    its front, magenta crescent epaulettes, two sphinxes one black one white
  major_08: >-
    a warm tan lion's head wreathed in a magenta flower garland, a white
    infinity sign above it, a violet mountain behind
  major_09: >-
    a warm tan lantern holding a white six-pointed star, a magenta hooded cloak,
    a long violet staff crossed behind it
  major_10: >-
    a great violet wheel lettered ROTA, a white sphinx couchant above it, a
    magenta serpent descending, a warm tan jackal rising
  major_11: >-
    a white upright sword crossed with warm tan scales, a violet crown between
    them, magenta veil behind
  major_12: >-
    a warm tan living T-cross of wood, a violet tunic, a white rope, a white halo
    hanging beneath it, magenta foliage crowning the cross
  major_13: >-
    a white skull in violet armour, a banner bearing a white five-petalled rose,
    a warm tan bone scythe, a magenta crown fallen beneath
  major_14: >-
    two warm tan cups pouring one into the other, a teal stream between them,
    magenta irises, a white triangle within a violet square
  major_15: >-
    a violet half-cube pedestal, a magenta inverted pentagram above it, a warm

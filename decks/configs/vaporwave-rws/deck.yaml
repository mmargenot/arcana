# Geometry and element manifest.
#
# YAML holds STRUCTURE: sizes, roles, which bank each layer binds to, how
# pieces assemble. Pixel data lives in tiles under the deck's artifacts assets
# dir, because pixels do not belong in a config file.
#
# Every size here is load-time validated: the border runs must divide evenly by
# the edge tile, and each tile must match its declared size.

geometry:
  card:   [160, 276]        # 1:1.725, true tarot is 1:1.727
  art:    [144, 224]        # 1:1.556, RWS scans measure 1:1.561
  margin: 8
  bands:
    numeral: 16             # above art
    title:   36             # below art

border:
  corner: 16                # corner tile is 16x16; also the band thickness
  edge:   8                 # repeating edge tile run length
  medallion:
    horizontal: 16          # slot width on top/bottom edges (geometry — divisibility)
    vertical:   20          # slot height on left/right edges
    style: suit             # suit (pip in cartouche) | lozenge (suit-coloured diamond) | none
    scale: small            # keyword (full/large/small/smaller/tiny) or a number; `none` continues the border

# ---------------------------------------------------------------- elements
# role determines placement:
#   corner    decorative motif overlaid on the beveled frame's corners,
#             mirrored into all four corners (the frame line itself is drawn
#             structurally by compose, not carried by this tile)
#   edge      decorative motif repeated along each run and mirrored across the
#             axes; like corner, it is ornament over the structural frame
#   medallion placed at edge centres, NEVER mirrored (a cup on its side
#             is not a cup), and drawn opaque so the frame cannot bisect it
#   pip       placed on the field lattice, mirrored horizontally
elements:
  corner:
    path: border/corner
    size: [16, 16]
    role: corner
    layers: [border]

  edge:
    path: border/edge
    size: [16, 8]           # authored horizontal; transposed for side edges
    role: edge
    layers: [border]

  cartouche:
    path: cartouche/roundel
    size: [24, 24]          # bulges 8px past the band, deliberately
    role: medallion
    layers: [motif]
    opaque: true            # asserted at load

  pip_wands:     {path: pips/wands,     size: [16, 16], role: pip, layers: [motif]}
  pip_cups:      {path: pips/cups,      size: [16, 16], role: pip, layers: [motif]}
  pip_swords:    {path: pips/swords,    size: [16, 16], role: pip, layers: [motif]}
  pip_pentacles: {path: pips/pentacles, size: [16, 16], role: pip, layers: [motif]}
  pip_rose:      {path: pips/rose,      size: [16, 16], role: pip, layers: [motif]}

# which pip each suit uses; majors fall back to rose
suit_pips:
  wands: pip_wands
  cups: pip_cups
  swords: pip_swords
  pentacles: pip_pentacles
  majors: pip_rose

# Pip sizing ("the tank"). gap is the buffer kept between pips and from the inner
# border; pips scale CONTINUOUSLY between min_scale and max_scale (×16px), auto-fit
# to the largest size that keeps every pip a gap from its neighbours and the
# border — so a rank is always countable. Every (layout, count) is placeable at
# these defaults (see pip_layouts below); a layout is only rejected at load if the
# knobs make it impossible (e.g. an absurd min_scale), with an informative error.
pip:
  gap: 6
  min_scale: 1.2    # smallest pip factor; 1x reads too small (≈19px at 1.2x)
  max_scale: 3

# Pip arrangement per rank (Ace..Ten). Each rank places `count` pips using the
# named algorithm from arcana.layout; `arcana cards --layout NAME` overrides all
# ranks at once. Arrangement follows the count, so it is keyed by rank. Every
# arrangement is centred on the card and sized as large as the buffer allows.
# Ordinaries (fess/pale/bend/chevron/pall) FOLD into parallel copies when a single
# line/arm won't hold the count; grids search their column count; a genuinely-2D
# shape that still can't fit (e.g. cross at a high rank) folds into a diamond. So
# every rank is valid at a good size; the mapping below just picks the character.
pip_layouts:
  default: square
  by_rank:
    1:  single
    2:  pale
    3:  chevron
    4:  square
    5:  saltire
    6:  bend
    7:  fess
    8:  pale
    9:  square
    10: square

# Heraldic field design per suit (the geometric background, from arcana.field).
# Field is the suit's identity; pip arrangement (above) is the rank's. Colours
# come from the suit's `field` bank in palette.yaml — the design is named, never
# authored. `arcana cards --field NAME` overrides every card to compare designs.
field_designs:
  default: plain
  by_suit:
    wands: per-bend       # fire — a dynamic diagonal
    cups: barry           # water — horizontal bars
    swords: paly          # air — vertical pales
    pentacles: checky     # earth — a chequered ground
    majors: plain

# Bitmap text labels (arcana.text + arcana.data). Numeral band (top) and title
# band (bottom) carry a card's identity, inked in the `border` bank so titles
# match the frame and vary with the palette. Engine ships default names; a deck
# overrides them here. All keys optional — these are the defaults.
labels:
  enabled: true
  numeral_style: arabic   # arabic (A,2..10) | words (ACE..TEN) — the split rank token
  split: false            # false: one combined title in the bottom band
                          # true:  rank/roman in the numeral band, name in the title band
  # suit_titles: {}       # per-suit display overrides, else the suit key UPPERCASED
  # major_titles: []      # major-name overrides by number 0..21, else canonical RWS
